<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Password Generator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    height: 100vh;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(15px);
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    width: 300px;
    box-shadow: 0 0 30px rgba(0,0,0,0.4);
}

h2 {
    margin-bottom: 20px;
    color: #fff;
}

input {
    width: 80%;
    padding: 10px;
    border-radius: 10px;
    border: none;
    outline: none;
    text-align: center;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

.generate {
    background: #22c55e;
    color: white;
}

.generate:hover {
    background: #16a34a;
}

.copy {
    background: #3b82f6;
    color: white;
}

.copy:hover {
    background: #2563eb;
}

#result {
    margin-top: 15px;
    word-break: break-all;
    font-weight: bold;
    color: #22c55e;
}

.strength {
    margin-top: 10px;
    font-size: 14px;
}

</style>
</head>

<body>

<div class="container">
    <h2>🔐 Password Generator</h2>

    <input type="number" id="length" value="8" min="4" max="20">

    <button class="generate" onclick="generatePassword()">Generate Password</button>

    <div id="result"></div>

    <div class="strength" id="strength"></div>

    <button class="copy" onclick="copyPassword()">Copy</button>
</div>

<script>
function generatePassword() {
    let length = document.getElementById("length").value;
    let chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*";
    let password = "";

    for (let i = 0; i < length; i++) {
        password += chars.charAt(Math.floor(Math.random() * chars.length));
    }

    document.getElementById("result").innerText = password;

    // Strength checker
    let strengthText = "";
    if (length < 6) strengthText = "Weak 😢";
    else if (length < 10) strengthText = "Medium 😐";
    else strengthText = "Strong 💪";

    document.getElementById("strength").innerText = "Strength: " + strengthText;
}

function copyPassword() {
    let text = document.getElementById("result").innerText;
    navigator.clipboard.writeText(text);
    alert("Copied!");
}
</script>

</body>
</html>
