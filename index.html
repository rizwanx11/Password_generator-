<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KeyForge \u2014 Password Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-1: #080811;
      --bg-2: #0e0e1c;
      --surface: rgba(255,255,255,0.045);
      --surface-2: rgba(255,255,255,0.07);
      --border: rgba(255,255,255,0.09);
      --border-active: rgba(130,100,255,0.55);
      --text-primary: #f0eeff;
      --text-secondary: rgba(240,238,255,0.5);
      --text-muted: rgba(240,238,255,0.28);
      --accent: #8264ff;
      --accent-2: #c084fc;
      --accent-glow: rgba(130,100,255,0.3);
      --green: #34d399;
      --yellow: #fbbf24;
      --red: #f87171;
      --radius: 22px;
      --radius-sm: 13px;
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="light"] {
      --bg-1: #ede9ff;
      --bg-2: #e4dfff;
      --surface: rgba(0,0,0,0.035);
      --surface-2: rgba(0,0,0,0.06);
      --border: rgba(0,0,0,0.09);
      --border-active: rgba(100,60,220,0.45);
      --text-primary: #110c2e;
      --text-secondary: rgba(18,13,46,0.52);
      --text-muted: rgba(18,13,46,0.3);
      --accent: #6440e8;
      --accent-2: #a855f7;
      --accent-glow: rgba(100,64,232,0.22);
    }

    html { font-size: 16px; }

    body {
      font-family: 'Syne', sans-serif;
      background: var(--bg-1);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
      position: relative;
      overflow-x: hidden;
      transition: background 0.3s var(--ease), color 0.3s var(--ease);
    }

    /* ---- Background orbs ---- */
    .bg-orbs { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .orb {
      position: absolute; border-radius: 50%; filter: blur(80px);
      opacity: 0.15; animation: drift 16s ease-in-out infinite alternate;
    }
    [data-theme="light"] .orb { opacity: 0.1; }
    .orb-1 { width: 480px; height: 480px; background: #7c3aed; top: -150px; left: -150px; }
    .orb-2 { width: 380px; height: 380px; background: #a855f7; bottom: -100px; right: -100px; animation-delay: -8s; }
    .orb-3 { width: 280px; height: 280px; background: #2dd4bf; top: 45%; left: 55%; animation-delay: -14s; opacity: 0.07; }
    @keyframes drift {
      from { transform: translate(0,0) scale(1); }
      to   { transform: translate(35px,25px) scale(1.07); }
    }

    /* ---- Card ---- */
    .card {
      position: relative; z-index: 1;
      width: 100%; max-width: 460px;
      background: var(--surface);
      backdrop-filter: blur(24px) saturate(150%);
      -webkit-backdrop-filter: blur(24px) saturate(150%);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 30px 28px 28px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.35);
      animation: slideUp 0.55s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ---- Header ---- */
    .header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 24px;
    }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo-icon {
      width: 34px; height: 34px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 16px var(--accent-glow);
    }
    .logo-icon svg { display: block; }
    .logo-text {
      font-size: 1.1rem; font-weight: 800; letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--text-primary) 40%, var(--accent-2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .theme-btn {
      width: 36px; height: 36px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 50%; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-secondary);
      transition: transform 0.25s var(--ease), box-shadow 0.25s var(--ease), background 0.2s;
    }
    .theme-btn:hover { transform: rotate(20deg) scale(1.1); box-shadow: 0 0 14px var(--accent-glow); background: var(--surface-2); }

    /* ---- Password Box ---- */
    .password-box {
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 13px 14px;
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 18px;
      transition: border-color 0.2s, box-shadow 0.2s;
      overflow: hidden; position: relative;
    }
    .password-box:focus-within {
      border-color: var(--border-active);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .password-box.flash::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent, var(--accent-glow), transparent);
      animation: flash 0.45s ease forwards;
    }
    @keyframes flash {
      0%   { transform: translateX(-100%); opacity: 0.6; }
      100% { transform: translateX(100%);  opacity: 0; }
    }

    #password-display {
      flex: 1; min-width: 0;
      font-family: 'DM Mono', monospace;
      font-size: 0.92rem; font-weight: 500;
      color: var(--text-primary);
      background: transparent; border: none; outline: none;
      letter-spacing: 0.05em;
      transition: filter 0.2s;
    }
    #password-display.blurred { filter: blur(6px); }

    .icon-btn {
      flex-shrink: 0;
      background: none; border: none; cursor: pointer;
      color: var(--text-secondary); padding: 4px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      transition: color 0.18s, background 0.18s, transform 0.18s;
    }
    .icon-btn:hover { color: var(--text-primary); background: var(--surface-2); transform: scale(1.12); }
    .icon-btn:active { transform: scale(0.9); }
    .icon-btn.copied { color: var(--green) !important; }

    /* ---- Strength ---- */
    .strength-wrap { margin-bottom: 20px; }
    .row-label {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 8px;
    }
    .label-text {
      font-size: 0.7rem; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--text-muted);
    }
    #strength-text {
      font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      transition: color 0.3s;
    }
    .bars { display: flex; gap: 5px; }
    .bar {
      height: 4px; flex: 1; border-radius: 99px;
      background: var(--border);
      transition: background 0.35s var(--ease), transform 0.2s;
    }
    .bar.lit { transform: scaleY(1.7); }

    /* ---- Length ---- */
    .length-section { margin-bottom: 20px; }
    .length-row { display: flex; align-items: center; gap: 12px; }

    input[type="range"] {
      -webkit-appearance: none; flex: 1; height: 5px;
      border-radius: 99px; background: var(--border);
      outline: none; cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px; height: 20px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 0 10px var(--accent-glow);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.3);
      box-shadow: 0 0 18px var(--accent-glow);
    }
    input[type="range"]::-moz-range-thumb {
      width: 20px; height: 20px; border-radius: 50%; border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 0 10px var(--accent-glow); cursor: pointer;
    }

    .len-num {
      font-family: 'DM Mono', monospace;
      font-size: 0.9rem; font-weight: 500;
      color: var(--text-primary);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      width: 52px; height: 38px;
      text-align: center; outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .len-num:focus { border-color: var(--border-active); box-shadow: 0 0 0 3px var(--accent-glow); }
    .len-num.err    { border-color: var(--red); }

    /* ---- Error ---- */
    .error-msg {
      font-size: 0.72rem; color: var(--red); font-weight: 600;
      display: flex; align-items: center; gap: 5px;
      margin-top: 7px;
      max-height: 0; overflow: hidden; opacity: 0;
      transition: max-height 0.25s, opacity 0.25s;
    }
    .error-msg.on { max-height: 30px; opacity: 1; }

    /* ---- Options ---- */
    .options-section { margin-bottom: 22px; }
    .toggles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 9px; }

    .tog {
      display: flex; align-items: center; gap: 10px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 11px 13px;
      cursor: pointer;
      user-select: none;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    }
    .tog:hover { border-color: var(--border-active); }
    .tog.on {
      border-color: var(--accent);
      background: rgba(130,100,255,0.08);
    }
    [data-theme="light"] .tog.on { background: rgba(100,64,232,0.06); }

    /* pill switch */
    .pill { position: relative; width: 32px; height: 18px; flex-shrink: 0; }
    .pill input { opacity: 0; width: 0; height: 0; position: absolute; }
    .pill-track {
      position: absolute; inset: 0; border-radius: 99px;
      background: var(--border);
      transition: background 0.2s;
    }
    .pill-track::after {
      content: ''; position: absolute;
      top: 2px; left: 2px; width: 14px; height: 14px;
      border-radius: 50%; background: #fff;
      transition: transform 0.22s var(--ease), box-shadow 0.2s;
    }
    .pill input:checked ~ .pill-track { background: var(--accent); }
